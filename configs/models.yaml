# Same format as data-agent-bench's configs/models.yaml.
providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  vllm:
    base_url: http://localhost:8000/v1   # vLLM's OpenAI-compatible server on Kaggle
    api_key_env: null

models:
  gemini-flash-lite:
    provider: gemini
    model: gemini-3.5-flash-lite
    rpm: 12
  groq-gpt-oss-120b:
    provider: groq
    model: openai/gpt-oss-120b
    rpm: 25
  # The model being trained, served by vLLM as `--served-model-name student`.
  student:
    provider: vllm
    model: student
